[package]
name = "gst-lan-server"
version = "0.1.0"
edition = "2021"
description = "The desktop's LAN server: TLS with a pinned self-signed certificate, the built web app, and a hand-off of /pair and /rpc to the app."
license = "UNLICENSED"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
sha2 = "0.10"
if-addrs = "0.13"
mdns-sd = "0.13"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "sync"] }
