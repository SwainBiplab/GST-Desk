[package]
name = "gst-desk"
version = "0.0.0"
edition = "2021"

[lib]
name = "gst_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the operating system's keychain for a person's own cloud AI key (prompt 48)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
gst-lan-server = { path = "../lan-server", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
sha2 = { version = "0.10", optional = true }
sysinfo = { version = "0.33", default-features = false, features = ["system"], optional = true }
libc = { version = "0.2", optional = true }

[features]
# tablets and phones on the shop network; off by default until it has been tried on a real machine
lan = ["dep:gst-lan-server", "dep:tokio"]
# offline AI: model files and the sidecar servers; off by default until it has been tried on a real machine
ai = ["dep:reqwest", "dep:sha2", "dep:sysinfo", "dep:libc"]
