<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- what the page may load and run; the same policy is sent as a header by public/_headers (which adds what a meta tag cannot: frame-ancestors) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>GST Desk</title>
    <script src="/entry-gate.js"></script>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- the data grid mounts its cell editor here; it must be the last child of body -->
    <div id="portal"></div>
  </body>
</html>
