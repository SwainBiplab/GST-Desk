name: desktop

# Builds signed installers on all three platforms. Artifacts stay in the workflow run;
# nothing is published here. release.yml reuses this workflow and drafts the GitHub release.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign the updater artifacts (needs TAURI_SIGNING_PRIVATE_KEY)'
        type: boolean
        default: true
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux (AppImage, deb)
            os: ubuntu-22.04
            bundles: appimage,deb
            target: ''
            artifact: linux
          - name: windows (MSI, NSIS)
            os: windows-latest
            bundles: msi,nsis
            target: ''
            artifact: windows
          - name: macos (DMG, universal)
            os: macos-latest
            bundles: dmg,app
            target: universal-apple-darwin
            artifact: macos
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Updater artifacts config
        shell: bash
        run: |
          if [ "${{ inputs.sign }}" = "true" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > apps/desktop/updater.ci.json
          else
            echo '{}' > apps/desktop/updater.ci.json
          fi

      - name: Build
        env:
          # Signing material comes only from repository secrets; none of it is ever printed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing and notarisation (placeholders until an Apple Developer account exists)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (placeholder: wire to the chosen certificate or HSM service)
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: >-
            --bundles ${{ matrix.bundles }}
            ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
            --config updater.ci.json

      - name: Verify bundles (size, headers)
        shell: bash
        run: node scripts/verify-release.mjs --bundle-dir apps/desktop/src-tauri/target

      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*-setup.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 14

  smoke:
    # The real app, driven through WebDriver: it launches, loads the demo business through its Rust
    # database, shows the data folder, and checks the updater accepts a valid signature and refuses a
    # tampered one. Runs on Windows (WebView2 + Edge WebDriver); see docs/runbooks/desktop-testing.md.
    name: smoke (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile

      - name: Rust unit tests
        run: pnpm --filter desktop test

      - name: Test key, signed fixtures and test config
        run: node apps/desktop/e2e/make-fixtures.mjs

      - name: Debug build with the test update key
        run: pnpm --filter desktop tauri build --debug --no-bundle --config e2e/.generated/test-config.json

      - name: Drivers (tauri-driver, and Edge WebDriver matching the installed WebView2)
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          $pv = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$pv/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath edgedriver

      - name: Smoke test
        run: >-
          node apps/desktop/e2e/smoke.mjs
          --app apps/desktop/src-tauri/target/debug/gst-desk.exe
          --native "${{ github.workspace }}/edgedriver/msedgedriver.exe"
          --fixtures apps/desktop/e2e/.generated/fixtures
