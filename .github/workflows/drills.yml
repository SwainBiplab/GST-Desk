name: drills

# Data-safety drills: back up, damage the database and restore; kill the app while it is issuing
# documents; migrate a Phase 0 database to the current schema. They spawn processes and move files, so
# they run on all three systems every night rather than on every push (tests/drills).
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drills:
    name: drills (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gst/drills test
