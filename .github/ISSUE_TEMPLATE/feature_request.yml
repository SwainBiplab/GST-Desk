name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: compliance
    attributes:
      label: Does it touch GST rules, returns or rate data?
      description: If yes, name the section or notification so the CA reviewer can check it.
