name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the document type, tax rate and place of supply if a calculation is wrong.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and platform
      placeholder: 0.1.0, Windows 11
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed GSTINs, names, phone numbers and amounts that identify a real customer
          required: true
