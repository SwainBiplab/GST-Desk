# Local cloud tier: `docker compose -f infra/docker-compose.yml up`. Nothing here is a provider service;
# the same images run on any host. Development credentials only: the API refuses them in production.
name: gstdesk

services:
  postgres:
    image: postgres:16.2-alpine
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: gst
    # logical replication for the PowerSync service
    command:
      [
        'postgres',
        '-c',
        'wal_level=logical',
        '-c',
        'max_replication_slots=10',
        '-c',
        'max_wal_senders=10',
      ]
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
      # the PowerSync service's own storage database, made on first start
      - ./powersync/init-storage.sql:/docker-entrypoint-initdb.d/10-powersync.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U owner -d gst']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '6379:6379'
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ['--config=/etc/otel/config.yml']
    volumes:
      - ./otel-collector.yml:/etc/otel/config.yml:ro
    ports:
      - '4318:4318'

  # streams each organisation's businesses to its devices; devices upload through the API
  powersync:
    image: journeyapps/powersync-service:latest
    command: ['start', '-r', 'unified']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_REPLICATION_URI: postgres://owner:owner@postgres:5432/gst
      PS_STORAGE_URI: postgres://owner:owner@postgres:5432/powersync_storage
      # base64url of POWERSYNC_JWT_SECRET below
      PS_JWT_SECRET_B64URL: ZGV2ZWxvcG1lbnQtb25seS1zeW5jLXNlY3JldC1jaGFuZ2UtbWUtNDg
    volumes:
      - ./powersync:/config:ro
    ports:
      - '8080:8080'

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: '8787'
      DATABASE_URL: postgres://owner:owner@postgres:5432/gst
      APP_DATABASE_URL: postgres://gst_app:app@postgres:5432/gst
      APP_DB_PASSWORD: app
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: gstdesk
      S3_SSE: none
      BASE_URL: http://localhost:8787
      TRUSTED_ORIGINS: http://localhost:1420,http://localhost:4173,tauri://localhost,http://tauri.localhost
      OTP_PROVIDER: mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_LEVEL: info
      POWERSYNC_URL: http://localhost:8080
      POWERSYNC_JWT_SECRET: development-only-sync-secret-change-me-48
      # a development stack is hit from one address (the load script, a developer's machine)
      RATE_LIMIT_IP_PER_MINUTE: '100000'
      RATE_LIMIT_ORG_PER_MINUTE: '100000'
    ports:
      - '8787:8787'
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres:
  redis:
  minio:
