# The collector the API sends traces and metrics to over OTLP/HTTP. Locally it prints a summary and keeps
# a Prometheus endpoint for Grafana; in production set OTEL_UPSTREAM to forward to your own backend
# (Grafana Cloud, Tempo, Jaeger, SigNoz) and nothing leaves the network otherwise.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  # emails, phones, GSTINs and PANs never belong in a span; the API scrubs messages, this is the second net
  attributes/scrub:
    actions:
      - key: user.email
        action: delete
      - key: user.phone
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889
  otlphttp/upstream:
    endpoint: ${env:OTEL_UPSTREAM}
    tls:
      insecure: false

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/scrub, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
